<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repose Toi</title>
<meta name="robots" content="noindex">
<style>
  :root { --vert: #1B5E4A; --texte: #111827; --gris: #6B7280; --fond: #f5faf8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--texte); background: var(--fond); -webkit-text-size-adjust: 100%; }
  main { max-width: 480px; margin: 0 auto; padding: 40px 20px 56px; text-align: center; }
  img.logo { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 20px rgba(27,94,74,.18); }
  h1 { font-size: 1.4rem; margin: 20px 0 6px; color: var(--vert); }
  p.sous { margin: 0 0 28px; color: var(--gris); font-size: .95rem; line-height: 1.5; }
  a.btn { display: block; margin: 12px 0; padding: 16px 20px; border-radius: 14px; text-decoration: none;
          font-size: 1.05rem; font-weight: 600; background: var(--vert); color: #fff; }
  a.btn.secondaire { background: #fff; color: var(--vert); border: 2px solid var(--vert); }
  a.btn:active { opacity: .85; }
  p.aide { margin: 24px 0 0; color: var(--gris); font-size: .85rem; line-height: 1.5; }
  @media (prefers-color-scheme: dark) {
    :root { --texte: #F3F5F9; --gris: #9CA3AF; --fond: #14171f; }
    body { background: var(--fond); color: var(--texte); }
    h1 { color: #6FD3B2; }
    a.btn { background: #2a7a62; }
    a.btn.secondaire { background: transparent; color: #6FD3B2; border-color: #2a7a62; }
  }
</style>
</head>
<body>
<main>
  <img class="logo" id="logo" alt="Repose Toi">
  <h1>Repose Toi</h1>
  <p class="sous">Un instant, on t'emmène au bon endroit.</p>

  <a class="btn" id="apple" href="https://apps.apple.com/app/repose-toi/id6761868495">Télécharger pour iPhone</a>
  <a class="btn secondaire" id="play" href="https://play.google.com/store/apps/details?id=com.base6994aee8050a3acad2922abf.app">Télécharger pour Android</a>

  <p class="aide" id="aide">Si rien ne s'ouvre, touche le bouton qui correspond à ton téléphone.</p>
  <p class="aide"><a id="accueil" href="/">Accueil Repose Toi</a></p>
</main>

<script>
(function () {
  // Cette page est servie pour toute URL inexistante : les chemins en
  // minuscules (/download, /telecharger) que le disque de travail ne permet pas
  // de stocker en double, et toutes les anciennes URL du site Base44.
  // La base est calculee pour fonctionner aussi bien sur github.io (sous-chemin)
  // que sur repose-toi.com (racine).
  var base = location.hostname.indexOf('github.io') !== -1 ? '/repose-toi-site/' : '/';

  document.getElementById('logo').src = base + 'assets/logo.png';
  document.getElementById('accueil').href = base;

  var chemin = decodeURIComponent(location.pathname).toLowerCase();

  // SUPPRESSION DE COMPTE, avant tout le reste.
  //
  // L'URL declaree dans la fiche Securite des donnees de Google Play est
  // /DeleteAccount, servie par un vrai fichier DeleteAccount.html. Les
  // variantes tombent ici : /deleteaccount en minuscules, /DeleteAccount/
  // avec un slash final, ou toute autre casse. On les renvoie sur la PAGE,
  // jamais sur l'accueil : une demande de suppression de compte ne doit pas
  // se perdre, et Google verifie cette URL.
  if (chemin.indexOf('deleteaccount') !== -1 || chemin.indexOf('supprimer') !== -1) {
    location.replace(base + 'DeleteAccount.html');
    return;
  }

  var veutApp = chemin.indexOf('download') !== -1 || chemin.indexOf('telecharger') !== -1;

  if (!veutApp) {
    // Ancienne URL quelconque : on renvoie vers l'accueil.
    location.replace(base);
    return;
  }

  if (location.search.indexOf('noredirect') !== -1) return;

  var ua = navigator.userAgent || '';
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var cible = iOS ? document.getElementById('apple').href
                  : (android ? document.getElementById('play').href : null);

  if (!cible) {
    document.getElementById('aide').textContent =
      'Touche le bouton qui correspond a ton telephone.';
    return;
  }

  setTimeout(function () { location.replace(cible); }, 50);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repose Toi — Livraison de repas à Conakry</title>
<meta name="description" content="Repose Toi livre tes repas à Conakry. Commande depuis l'application iPhone ou Android.">
<meta property="og:title" content="Repose Toi">
<meta property="og:description" content="Livraison de repas à Conakry. Disponible sur iPhone et Android.">
<style>
  :root { --vert: #1B5E4A; --texte: #111827; --gris: #6B7280; --fond: #f5faf8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--texte); background: var(--fond); -webkit-text-size-adjust: 100%; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 20px 56px; text-align: center; }
  img.logo { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 6px 20px rgba(27,94,74,.18); }
  h1 { font-size: 1.75rem; margin: 22px 0 8px; color: var(--vert); }
  p.sous { margin: 0 0 32px; color: var(--gris); font-size: 1rem; line-height: 1.55; }
  a.btn { display: block; margin: 12px 0; padding: 16px 20px; border-radius: 14px; text-decoration: none;
          font-size: 1.05rem; font-weight: 600; background: var(--vert); color: #fff; }
  a.btn.secondaire { background: #fff; color: var(--vert); border: 2px solid var(--vert); }
  a.btn:active { opacity: .85; }
  section.contact { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(107,114,128,.25);
                    font-size: .9rem; line-height: 1.7; color: var(--gris); }
  section.contact a { color: var(--vert); }
  @media (prefers-color-scheme: dark) {
    :root { --texte: #F3F5F9; --gris: #9CA3AF; --fond: #14171f; }
    body { background: var(--fond); color: var(--texte); }
    h1 { color: #6FD3B2; }
    a.btn { background: #2a7a62; }
    a.btn.secondaire { background: transparent; color: #6FD3B2; border-color: #2a7a62; }
    section.contact a { color: #6FD3B2; }
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo.png" alt="Repose Toi">
  <h1>Repose Toi</h1>
  <p class="sous">Tes repas livrés à Conakry.<br>Commande depuis l'application.</p>

  <a class="btn" href="https://apps.apple.com/app/repose-toi/id6761868495">Télécharger pour iPhone</a>
  <a class="btn secondaire" href="https://play.google.com/store/apps/details?id=com.base6994aee8050a3acad2922abf.app">Télécharger pour Android</a>

  <section class="contact">
    Une question ? Écris-nous :<br>
    <a href="mailto:support.reposetoi@gmail.com">support.reposetoi@gmail.com</a><br><br>
    <a href="https://docs.google.com/document/d/e/2PACX-1vQs2DD0gkoeygr_ma441Olynorz66eESQPOblu_qPb7LdYJoKXNnvXv9XtZ0lD9laNMWntJWrzlL4xZ/pub">Politique de confidentialité</a>
  </section>
</main>
</body>
</html>

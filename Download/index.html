<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Télécharger Repose Toi</title>
<meta name="description" content="Télécharge l'application Repose Toi : livraison de repas à Conakry.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Télécharger Repose Toi">
<meta property="og:description" content="Livraison de repas à Conakry. Disponible sur iPhone et Android.">
<style>
  :root { --vert: #1B5E4A; --vert-clair: #e8f5f0; --texte: #111827; --gris: #6B7280; --fond: #f5faf8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--texte); background: var(--fond); -webkit-text-size-adjust: 100%; }
  main { max-width: 480px; margin: 0 auto; padding: 40px 20px 56px; text-align: center; }
  img.logo { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 20px rgba(27,94,74,.18); }
  h1 { font-size: 1.5rem; margin: 20px 0 6px; color: var(--vert); }
  p.sous { margin: 0 0 28px; color: var(--gris); font-size: .95rem; line-height: 1.5; }
  a.btn { display: block; margin: 12px 0; padding: 16px 20px; border-radius: 14px; text-decoration: none;
          font-size: 1.05rem; font-weight: 600; background: var(--vert); color: #fff; }
  a.btn.secondaire { background: #fff; color: var(--vert); border: 2px solid var(--vert); }
  a.btn:active { opacity: .85; }
  p.aide { margin: 24px 0 0; color: var(--gris); font-size: .85rem; line-height: 1.5; }
  p.pied { margin: 32px 0 0; font-size: .8rem; color: var(--gris); }
  p.pied a { color: var(--vert); }
  @media (prefers-color-scheme: dark) {
    :root { --texte: #F3F5F9; --gris: #9CA3AF; --fond: #14171f; }
    body { background: var(--fond); color: var(--texte); }
    h1 { color: #6FD3B2; }
    a.btn { background: #2a7a62; }
    a.btn.secondaire { background: transparent; color: #6FD3B2; border-color: #2a7a62; }
    p.pied a { color: #6FD3B2; }
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="../assets/logo.png" alt="Repose Toi">
  <h1>Télécharger Repose Toi</h1>
  <p class="sous">Livraison de repas à Conakry.<br>Choisis ton téléphone :</p>

  <a class="btn" id="apple" href="https://apps.apple.com/app/repose-toi/id6761868495">Télécharger pour iPhone</a>
  <a class="btn secondaire" id="play" href="https://play.google.com/store/apps/details?id=com.base6994aee8050a3acad2922abf.app">Télécharger pour Android</a>

  <p class="aide">Si le téléchargement ne démarre pas tout seul, touche le bouton qui correspond à ton téléphone.</p>

  <noscript>
    <p class="aide">Touche le bouton qui correspond à ton téléphone.</p>
  </noscript>

  <p class="pied"><a href="../">Accueil Repose Toi</a></p>
</main>

<script>
(function () {
  var APPLE = document.getElementById('apple').href;
  var PLAY = document.getElementById('play').href;

  // ?noredirect=1 : permet de voir la page depuis un iPhone sans partir sur l'App Store.
  if (location.search.indexOf('noredirect') !== -1) return;

  var ua = navigator.userAgent || '';
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var cible = iOS ? APPLE : (android ? PLAY : null);

  // Ordinateur : on ne redirige pas, les deux boutons suffisent.
  if (!cible) return;

  // Court délai pour que les boutons de secours soient déjà affichés : dans les
  // navigateurs intégrés de TikTok, Facebook et Instagram, l'ouverture du store
  // est parfois bloquée et la page doit rester lisible derrière.
  setTimeout(function () { location.replace(cible); }, 50);
})();
</script>
</body>
</html>
